<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Sales Dashboard</h1>
  <div class="card">
    <strong>Rows:</strong> {{ row_count }} &nbsp;&nbsp;
    <strong>Total Sales:</strong> {{ total_sales }}
  </div>
  <table>
    <thead>
      <tr>
        <th>Order ID</th><th>Customer</th><th>Product</th>
        <th>Quantity</th><th>Unit Price</th><th>Total Amount</th>
      </tr>
    </thead>
    <tbody>
      {% for row in sales %}
      <tr>
        <td>{{ row.order_id }}</td>
        <td>{{ row.customer }}</td>
        <td>{{ row.product }}</td>
        <td>{{ row.quantity }}</td>
        <td>{{ row.unit_price }}</td>
        <td>{{ row.total_amount }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
